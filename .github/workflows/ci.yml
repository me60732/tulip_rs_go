# CI for the Go bindings: install the native lib via the prebuilt GitHub
# release path (also exercises the --prebuilt bootstrap), then build/vet and
# smoke-run one end-to-end example. No Rust toolchain needed.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install native library (prebuilt release asset)
        run: ./bootstrap.sh --prebuilt

      - name: gofmt check
        run: test -z "$(gofmt -l . | grep -v '^$')" || { gofmt -l .; exit 1; }

      - name: Build & vet
        run: |
          go build ./...
          go vet ./...

      - name: Smoke — examples/adx end-to-end
        run: go run ./examples/adx | tail -n 3

  index-pkg-go-dev:
    # Only for tagged releases — pkg.go.dev serves immutable per-version docs,
    # so there's nothing new to index on a plain main-branch push.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger pkg.go.dev indexing for this tag
        run: |
          module="github.com/me60732/tulip_rs_go@${GITHUB_REF_NAME}"
          echo "Requesting pkg.go.dev fetch for ${module}"
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://pkg.go.dev/fetch/${module}")
          echo "pkg.go.dev responded with HTTP ${status}"
          if [ "$status" != "200" ]; then
            echo "::warning::pkg.go.dev fetch trigger returned HTTP ${status} (non-fatal)"
          fi
